spring.application.name=User Management
server.port=7081

spring.data.mongodb.database=user_db

#Eureka Configuration
eureka.client.register-with-eureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:7111/eureka/
eureka.instance.hostname=localhost
eureka.instance.virtual-host-name=USER-SVC

#Logging config
logging.level.root=INFO
logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.web=WARN

#Swagger Config
com.taskmanager.swagger.autoconfig = true


#JWT Secret Key
