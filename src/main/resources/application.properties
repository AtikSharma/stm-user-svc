spring.application.name=User Management
server.port=7081

#DataBase Connection 
spring.jpa.database=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/user_db
spring.datasource.username=root
spring.datasource.password=root

#Schema Validation Config
spring.jpa.hibernate.ddl-auto=validate

#Eureka Configuration
eureka.client.register-with-eureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:7111/eureka/
eureka.instance.hostname=localhost
eureka.instance.virtual-host-name=USER-SVC

#Logging config
logging.level.root=INFO
logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.web=WARN

#Swagger Config
com.taskmanager.swagger.autoconfig = true